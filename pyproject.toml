[project]
name = "rsi"
version = "0.1.0"
description = "Personal science assistant with a self-improving harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "litellm",
    "numpy",
    "scipy",
    "pandas",
    "python-multipart",
]

[project.scripts]
rsi = "rsi.__main__:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
